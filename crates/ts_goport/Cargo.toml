[package]
name = "ts_goport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Parts of this crate built as their own crates. Their files stay in src/
# (see src/goport_util_root.rs and src/goport_lsproto_root.rs).
goport_lsproto = { path = "parts/goport_lsproto" }
goport_util = { path = "parts/goport_util" }
rustc-hash = "=2.1.2"
indexmap = "=2.14.0"
memchr = "=2.8.2"
smallvec = "=1.15.1"
bumpalo = "=3.20.3"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
flate2 = "=1.1.10"
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
rustix = { version = "=1.1.5", features = ["event", "fs", "pipe", "process", "stdio", "termios"] }
# Go `os/signal` Notify for `signal.NotifyContext` in cmd/tsc (--watch, --lsp).
signal-hook = "=0.4.4"

# jemalloc does not build for Windows (msvc, or gnu through zig); the
# `jemalloc` feature does nothing there.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = { version = "=0.7.0", optional = true }
# `thread.arena` through its safe `Access` API (program.rs
# `jemalloc_thread_arena`): the one checker of `--singleThreaded` allocates
# in the arena of the loading thread.
tikv-jemalloc-ctl = { version = "=0.7.0", optional = true }

# ipc/transport.rs: Windows named pipes for `--pipe` (Go `winio.ListenPipe`),
# through miow's safe `NamedPipe` API. execute/tsc/compile.rs: Go
# `os.SameFile` in the Windows `LookPath`. No `unsafe` here (D-W1).
[target.'cfg(windows)'.dependencies]
miow = "=0.6.1"
same-file = "=1.0.6"

# `process`: prctl(PR_SET_THP_DISABLE) in thp_guard.rs. `signal`: the
# signal mask at start in bin/tsgo.rs (`unblock_go_signals`).
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }

[features]
default = ["jemalloc"]
# jemalloc as the global allocator of the goport binaries (default; the
# shipped build). `--no-default-features` gives glibc malloc with its
# tunables. See bin/goport.rs `set_malloc_tunables`.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Go build tag `noembed`, as in Go's release builds and npm packages: the
# lib files are not in the binary. The binaries read them from their own
# directory and print their real paths, not `bundled:///libs/...`. Put them
# there with crates/ts_goport/scripts/copy-libs.sh (build-release.sh does
# this).
noembed = ["goport_util/noembed"]

[lints]
workspace = true

# Rust port of the pinned typescript-go baseline tests. `test = false` keeps
# it out of `cargo test --workspace`; run it with `--test go_baselines`.
[[test]]
name = "go_baselines"
path = "tests/go_baselines/main.rs"
test = false
