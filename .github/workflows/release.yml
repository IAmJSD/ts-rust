# Builds, packs and tests the tsc-rs release: the npm packages tsc-rs, @tsc-rs/linux-x64 and
# @tsc-rs/darwin-arm64, and one standalone archive per platform (tsc and the lib files).
#
# A tag v<version> (for example v0.1.0-preview.1) also creates a GitHub prerelease and publishes
# the npm packages under the dist-tag `next`. npm trusted publishing (OIDC) authenticates the
# publish: no npm token. Each of the 3 packages trusts this workflow file and the environment `npm`
# (npm/README.md, "Trusted publishing"). Pull requests that change the release files, and a manual
# run, do everything but the release and the publish.
#
# These builds are the plain shipped profile (fat LTO), without the PGO and BOLT of
# crates/ts_goport/scripts/build-release.sh, which needs a host with BOLT and the project inputs.
# Linux is static musl and non-PIE, so it starts on any x86-64 Linux, Alpine too (npm/README.md,
# "Linux libc").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "npm/**"
      - "scripts/goport/npm-pack.sh"
      - "crates/ts_goport/scripts/copy-libs.sh"
      - "LICENSE"
      - "NOTICE.md"
      - "licenses/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The toolchain of crates/ts_goport/scripts/build-release.sh.
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            v=${GITHUB_REF_NAME#v}
            [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
            # 0.0.x are the npm placeholders (npm/trust-setup.sh); the publish would skip them.
            [[ $v != 0.0.* ]] || { echo "::error::0.0.x versions are the npm placeholders"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v=0.0.0-ci.$GITHUB_RUN_NUMBER
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v"

  build:
    name: build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: blacksmith-16vcpu-ubuntu-2404
          # jemalloc does not cross-build for macOS with zig, so this builds on a Mac.
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: blacksmith-12vcpu-macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      # As build-release.sh: the musl build compiles jemalloc with musl-gcc, links static with no PIE,
      # and has bin/tsgo.rs JEMALLOC_CONF built in, so the tsc does not exec itself at start. No
      # GOPORT_BUILD_VERSION: the tsc reports the TypeScript version, which typesVersions matching
      # reads (npm/README.md, "tsc-rs releases").
      - name: Build
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            export CC_x86_64_unknown_linux_musl=musl-gcc
            export RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static"
            JEMALLOC_SYS_WITH_MALLOC_CONF=$(sed -n 's/^const JEMALLOC_CONF: &str = "\([^"]*\)";$/\1/p' crates/ts_goport/src/bin/tsgo.rs | head -1)
            [[ -n $JEMALLOC_SYS_WITH_MALLOC_CONF ]] || { echo "::error::no JEMALLOC_CONF in bin/tsgo.rs"; exit 1; }
            export JEMALLOC_SYS_WITH_MALLOC_CONF
          fi
          cargo build --profile goport --locked -p ts_goport --bin tsgo --features noembed --target ${{ matrix.target }}
          mkdir -p "$RUNNER_TEMP/out"
          cp "target/${{ matrix.target }}/goport/tsgo" "$RUNNER_TEMP/out/tsc"
      - name: Check the tsc
        run: |
          out="$RUNNER_TEMP/out"
          dir="$RUNNER_TEMP/check"
          crates/ts_goport/scripts/copy-libs.sh "$dir"
          cp "$out/tsc" "$dir/tsc"
          [[ $("$dir/tsc" --version) == "Version 7."* ]]
          cd "$RUNNER_TEMP"
          echo 'const x: number = "a";' > a.ts
          "$dir/tsc" --listFilesOnly --lib es5 a.ts | grep -qx "$dir/lib.es5.d.ts"
          set +e
          "$dir/tsc" --noEmit a.ts > check.txt
          rc=$?
          set -e
          cat check.txt
          [[ $rc == 2 ]] && grep -q "error TS2322" check.txt
          if [[ $RUNNER_OS == Linux ]]; then
            file "$dir/tsc" | tee /dev/stderr | grep -q "statically linked"
            # Static: it starts on musl (Alpine) too.
            docker run --rm -v "$dir:/t:ro" alpine:3 /t/tsc --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tsc-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/tsc
          if-no-files-found: error

  package:
    needs: [version, build]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # main's Go pin, as ci.yml resolves it.
      - name: Resolve the Go pin
        id: pin
        run: |
          key=$(jq -r '.batch.upstreamPin.to // empty' docs/typechecker-state/current.json)
          python3 scripts/upstream/pin.py show ${key:+"$key"} > "$RUNNER_TEMP/pin.json"
          jq -r '"key=\(.key)", "repo=\(.repo)", "commit=\(.commit)", "subdir=\(.subdir // "")"' "$RUNNER_TEMP/pin.json" >> "$GITHUB_OUTPUT"
      # npm-pack.sh reads the pin's package input (packages/), its lib files, its LICENSE.txt and
      # NOTICE.txt, and builds the JS API with the repo's own tsc (npm workspaces at the root).
      - name: Check out the pinned Go source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: go-pin
          sparse-checkout: |
            packages
            ${{ steps.pin.outputs.subdir }}/internal/bundled/libs
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: go-pin
      - uses: actions/download-artifact@v5
        with:
          pattern: tsc-*
          path: ${{ runner.temp }}/bins
      - name: Pack
        env:
          GOPORT_PIN: ${{ steps.pin.outputs.key }}
          NPM_PACK_GO_DIR: ${{ github.workspace }}/go-pin/${{ steps.pin.outputs.subdir }}
        run: |
          bins="$RUNNER_TEMP/bins"
          chmod +x "$bins"/tsc-*/tsc
          scripts/goport/npm-pack.sh --name tsc-rs --package-version "$VERSION" \
            --also "darwin-arm64=$bins/tsc-darwin-arm64/tsc" "$RUNNER_TEMP/pkg" "$bins/tsc-linux-x64/tsc"
      # One archive per platform: the platform package's lib dir (tsc and the lib files, which a
      # noembed tsc reads next to it), LICENSE and NOTICE.txt.
      - name: Archives
        run: |
          pkg="$RUNNER_TEMP/pkg" dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for platform in linux-x64 darwin-arm64; do
            name="tsc-rs-$VERSION-$platform"
            mkdir -p "$RUNNER_TEMP/archive/$name"
            cp -r "$pkg/tsc-rs-$platform/lib/." "$pkg/tsc-rs-$platform/LICENSE" "$pkg/tsc-rs-$platform/NOTICE.txt" "$RUNNER_TEMP/archive/$name/"
            tar -C "$RUNNER_TEMP/archive" -czf "$dist/$name.tar.gz" "$name"
          done
          cp "$pkg"/*.tgz "$dist/"
          (cd "$dist" && sha256sum -- *.tgz *.tar.gz > SHA256SUMS)
          cat "$dist/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  # Installs the npm packages in a fresh project on each platform, as a user would.
  verify:
    name: verify (${{ matrix.platform }})
    needs: [version, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: release
          path: ${{ runner.temp }}/dist
      - name: npm install and check
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir proj && cd proj
          echo '{"name":"smoke","private":true}' > package.json
          # The other platform's package is not on npm yet: --offline skips that optional dependency.
          npm install --offline --no-audit --no-fund "$dist/tsc-rs-${{ matrix.platform }}-$VERSION.tgz" "$dist/tsc-rs-$VERSION.tgz"
          npx tsc-rs --version
          echo 'export const x: number = 1;' > ok.ts
          npx tsc-rs --noEmit --strict ok.ts
          echo 'const x: number = "a";' > bad.ts
          set +e
          npx tsc-rs --noEmit bad.ts > check.txt
          rc=$?
          set -e
          cat check.txt
          [[ $rc == 2 ]] && grep -q "error TS2322" check.txt
      - name: Archive check
        run: |
          dist="$RUNNER_TEMP/dist"
          tar -xzf "$dist/tsc-rs-$VERSION-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/tsc-rs-$VERSION-${{ matrix.platform }}/tsc" --version

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, verify]
    # Trusted publishing needs a GitHub-hosted runner. The environment is part of the trust: add
    # required reviewers to it in the repo settings to approve each publish.
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11 && npm --version
      - uses: actions/download-artifact@v5
        with:
          name: release
          path: dist
      # Platform packages first, then the main package that depends on them. A version that is
      # already on npm is skipped, so a failed run can run again. While the repo is private, npm
      # makes no provenance; from a public repo it adds it by itself.
      - name: Publish to npm (next)
        run: |
          for pkg in @tsc-rs/linux-x64:tsc-rs-linux-x64 @tsc-rs/darwin-arm64:tsc-rs-darwin-arm64 tsc-rs:tsc-rs; do
            name=${pkg%%:*} file=./dist/${pkg#*:}-$VERSION.tgz
            [[ -f $file ]] || { echo "::error::missing package $file"; exit 1; }
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              npm publish "$file" --tag next --access public
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "tsc-rs $VERSION" --generate-notes \
            --notes "Preview release. Install with \`npm install -D tsc-rs@next\`, or download the archive for your platform."
